[project]
name = "drt-api"
version = "0.1.0"
description = "Displays disaster/incidents reported by People/Rescue teams sorted by urgency/severity."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "passlib[argon2]>=1.7.4",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-jose[cryptography]>=3.5.0",
    "sqlalchemy>=2.0.52",
]
